utton[aria-pressed=true]{color:#211a2e}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 18px}.period{display:flex;align-items:center;gap:6px}.period select{border:0;background:transparent;padding:4px 2px;font-weight:650}.period option{background:var(--card)}.divider{height:20px;width:1px;background:var(--line);margin:0 4px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px}.kpi{padding:20px 22px}.kpi-label{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:13px}.kpi-label svg{color:var(--sub)}.value{font-size:34px;font-weight:650;line-height:1.2;margin:11px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.value span{font-size:13px;letter-spacing:0;font-weight:400;color:var(--sub);margin-left:7px}.kpi small{display:block}.chart-card{padding:20px 22px 16px;margin-bottom:16px}.section-heading{justify-content:space-between;flex-wrap:wrap}.section-heading p{margin-top:3px}.legend{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px}.legend:before{content:'';width:8px;height:8px;border-radius:2px;background:var(--primary)}.chart{display:flex;gap:8px;margin-top:24px;height:200px;position:relative}.axis{display:flex;flex-direction:column;justify-content:space-between;width:27px;padding-bottom:24px;color:var(--sub);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}.plot{position:relative;flex:1;min-width:0;display:grid;gap:5px;align-items:stretch;background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 calc(50% - 12px)/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 calc(100% - 24px)/100% 1px no-repeat}.bar-cell{padding:0;border:0;min-width:0;min-height:0;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-end;background:transparent;gap:0;position:relative;overflow:visible}.bar-cell:hover{background:var(--tint)}.bar{width:min(100%,32px);background:var(--primary);border-radius:3px 3px 0 0;opacity:.62;min-height:2px}.bar-cell[aria-pressed=true] .bar,.bar-cell:hover .bar,.bar-cell:focus-visible .bar{opacity:1}.bar-cell[aria-pressed=true]{background:var(--tint)}.tick{height:24px;padding-top:7px;font-size:10px;line-height:16px;color:var(--sub)}.tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card);box-shadow:var(--shadow);font-size:11px;z-index:2;pointer-events:none}.bar-cell:hover .tip,.bar-cell:focus-visible .tip{display:block}.chart-foot{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);min-height:34px}.filter-chip{color:var(--primary);background:var(--tint);border:0}.details{overflow:hidden}.details .section-heading{padding:18px 22px}.search{padding:7px 10px;width:210px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:var(--bg);outline:none;caret-color:var(--primary)}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;text-align:left}th{background:var(--soft);font-weight:500;color:var(--sub);padding:10px 22px;font-size:12px}td{padding:14px 22px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}tbody tr:last-child td{border-bottom:0}.project-name{font-weight:600}.project-name+small{display:block;margin-top:3px}.num{text-align:right}.source{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:2px 6px;display:inline-block}.done{color:var(--positive);background:var(--positive-bg);padding:3px 7px;border-radius:4px;font-size:11px}.pending{color:var(--sub);font-size:11px}.detail-action{font-size:12px;color:var(--primary);border:0;background:transparent;padding:5px 0}.empty{text-align:center;padding:36px;color:var(--sub)}.footer-note{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:17px}.rank-intro{padding:20px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.rank-intro strong{font-size:24px;display:block;margin-top:6px}.rank-intro strong span{font-size:13px;color:var(--sub);font-weight:400}.self td{background:var(--tint)}.avatar{width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--line);border-radius:50%;margin-right:10px;font-size:12px}.rank-number{font-size:16px;font-weight:600}.rank-bar{display:block;background:var(--soft);width:150px;max-width:100%;height:4px;margin-top:7px;border-radius:3px}.rank-bar i{display:block;height:100%;background:var(--primary);border-radius:3px}.hidden{display:none!important}dialog{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:0;width:min(540px,94vw);max-height:86dvh;box-shadow:var(--shadow)}dialog::backdrop{background:#100d1c77}.dialog-header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.dialog-body{padding:20px 22px;max-height:65dvh;overflow:auto}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.fact-grid strong{display:block;margin-top:4px}.timeline{border-left:1px solid var(--line);margin:8px 0 0 5px;padding-left:18px}.timeline section{position:relative;padding-bottom:22px}.timeline section:before{content:'';position:absolute;left:-22px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--primary)}.timeline p{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.8}.dialog-note{background:var(--bg);padding:12px;border-radius:6px;color:var(--sub);font-size:12px;line-height:1.8}.preview-label{border:1px solid var(--line);border-radius:4px;padding:2 @media(max-width:520px){.header{flex-wrap:wrap;gap:15px}.toolbar>.tools{width:100%}.period{flex-wrap:wrap}.kpis{grid-template-columns:1fr}.kpi{display:grid;grid-template-columns:1fr auto;gap:3px 12px}.kpi-label svg{display:none}.value{margin:0;grid-column:2;grid-row:1/3}.kpi small{grid-column:1}.chart{height:160px}.tick{font-size:9px}.rank-intro{align-items:flex-start}.chart-foot{align-items:flex-start}.footer-note{display:block}.footer-note span{display:block;margin-top:4px}.section-heading .search{width:100%}.details .section-heading{gap:12px}}

<div class="shell"><header class="header"><div class="brand"><svg><use href="#cup"/></svg><h1>成就</h1><span class="preview-label">界面预览 · 示例数据</span></div><div class="tools"><div class="seg" aria-label="成就视图"><button data-tab="overview" aria-pressed="true">概览</button><button data-tab="ranking" aria-pressed="false">排行</button></div><button id="theme" class="icon" aria-label="切换昼夜模式" title="切换昼夜模式"><svg><use href="#moon"/></svg></button></div></header>
<div class="toolbar"><div class="seg modes" id="modes" aria-label="统计工序"></div><div class="tools"><div class="seg" aria-label="统计周期"><button data-period="month" aria-pressed="true">月</button><button data-period="year" aria-pressed="false">年</button></div><div class="period"><button class="icon ghost" id="previous" aria-label="上一周期"><svg><use href="#left"/></svg></button><select id="year" aria-label="选择年份"><option>2026</option><option>2025</option></select><span>年</span><span id="monthWrap"><select id="month" aria-label="选择月份"></select>月</span><button class="icon ghost" id="next" aria-label="下一周期"><svg><use href="#right"/></svg></button><button id="today" class="ghost">回到本期</button></div></div></div>
<section id="overview"><div class="kpis" id="kpis"></div><section class="card chart-card"><div class="section-heading"><div><h2>完成趋势</h2><p class="sub" id="chartSubtitle"></p></div><span class="legend" id="legend"></span></div><div class="chart"><div class="axis" id="axis"></div><div class="plot" id="plot" aria-label="完成页数趋势"></div></div><div class="chart-foot"><span id="chartHint">点击柱形，查看当天完成的作品</span><button id="clearFilter" class="filter-chip hidden"></button></div></section>
<section class="card details"><div class="section-heading"><div><h2>作品明细 <span class="sub" id="rowCount"></span></h2><p class="sub" id="listHint">页数按所选周期统计，章节状态按当前工序显示</p></div><input class="search" id="search" placeholder="搜索漫画或章节" aria-label="搜索漫画或章节"></div><div class="table-scroll"><table><thead><tr><th>漫画 / 章节</th><th class="num">本期完成</th><th>章节状态</th><th>最近统计日期</th><th>时间来源</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></section>
<section id="ranking" class="hidden"><div class="card rank-intro"><div><p class="sub" id="rankPeriod"></p><strong id="selfRank"></strong></div><div><p class="sub">本地档案对比</p><button id="profiles" class="detail-action">查看示例档案 <svg><use href="#right"/></svg></button></div></div><section class="card details"><div class="section-heading"><div><h2>完成页数排行</h2><p class="sub">所有档案使用相同工序和周期，不跨工序加权</p></div><span class="preview-label">5 份示例档案</span></div><div class="table-scroll"><table><thead><tr><th>排名</th><th>成员</th><th class="num">完成页数</th><th class="num">完成章节</th><th>完成量</th></tr></thead><tbody id="rankRows"></tbody></table></div></section></section>
<footer class="footer-note"><span>按各作品选定的统计时间归档 · 整话完成日期取最后一页</span><span id="totalNote"></span></footer></div>
<dialog id="detail"><header class="dialog-header"><div><h2 id="detailTitle"></h2><p class="sub" id="detailSubtitle"></p></div><button class="icon ghost" id="closeDetail" aria-label="关闭详情">×</button></header><div class="dialog-body" id="detailBody"></div></dialog>
<script>
const $=s=>document.querySelector(s), modes=['嵌字','翻译','校对','监修'],sources=['标记时间','文件修改时间','手动日期'];
const state={tab:'overview',mode:'嵌字',period:'month',year:2026,month:10,filter:null,search:''};
const titles=['星海来信','雨后的便利店','月下旅人','夏日放映室','山间邮局','猫与旧书店'];const data=[];
for(let year=2025;year<=2026;year++)for(let month=1;month<=(year===2026?10:12);month++)for(let mode=0;mode<4;mode++)for(let c=0;c<8;c++){
const total=12+(c*7+month+mode)%17,done=c%3!==1,count=done?total:Math.floor(total*.65),limit=year===2026&&month===10?10:new Date(year,month,0).getDate();const base=1+(c*3+mode*2)%(limit-3);const events=Array.from({length:count},(_,p)=>({page:p+1,date:`${year}-${String(month).padStart(2,'0')}-${String(Math.min(limit,base+Math.floor(p/7))).padStart(2,'0')}`}));data.push({id:data.length,title:titles[c%6],chapter:`第 ${month*2+c+1} 话`,mode:modes[mode],total,events,source:sources[(c+mode)%3]});}
const fmt=n=>n.toLocaleString('zh-CN');const prefix=()=>`${state.year}${state.period==='month'?'-'+String(state.month).padStart(2,'0'):''}`;const periodLabel=()=>`${state.year} 年${state.period==='month'?' '+state.month+' 月':''}`;const last=r=>r.events.at(-1).date;
function selectedEvents(r){return r.events.filter(e=>e.date.startsWith(prefix()))}function currentRows(){return data.filter(r=>r.mode===state.mode&&selectedEvents(r).length)}function count(rows){return rows.reduce((n,r)=>n+selectedEvents(r).length,0)}function isComplete(r){return r.events.length===r.total}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sync(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab));document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.period===state.period));$('#overview').classList.toggle('hidden',state.tab!=='overview');$('#ranking').classList.toggle('hidden',state.tab!=='ranking');$('#year').value=state.year;$('#month').value=state.month;Array.from($('#month').options).forEach(o=>o.disabled=state.year===2026&&Number(o.value)>10);$('#monthWrap').classList.toggle('hidden',state.period==='year');$('#previous').disabled=state.year===2025&&(state.period==='year'||state.month===1);$('#next').disabled=state.year===2026&&(state.period==='year'||state.month>=10);$('#modes').innerHTML=modes.map(m=>`<button data-mode="${m}" aria-pressed="${state.mode===m}">${m}</button>`).join('');render()}
function render(){const rows=currentRows(),n=count(rows),chapters=rows.filter(r=>isComplete(r)&&last(r).startsWith(prefix())).length,works=new Set(rows.map(r=>r.title)).size;$('#kpis').innerHTML=[['完成'+state.mode,n,'页','本期归档的已完成页面','pages'],['完成章节',chapters,'话','最后一页在本期完成的章节','book'],['涉及作品',works,'部','本期留下完成记录的漫画','folder']].map(a=>`<article class="card kpi"><div class="kpi-label">${a[0]}<svg><use href="#${a[4]}"/></svg></div><p class="value">${fmt(a[1])}<span>${a[2]}</span></p><small>${a[3]}</small></article>`).join('');$('#totalNote').textContent=`累计${state.mode} ${fmt(data.filter(r=>r.mode===state.mode).reduce((n,r)=>n+r.events.length,0))} 页`;renderChart(rows);renderRows(rows);renderRank(n,chapters)}
function renderChart(rows){const length=state.period==='month'?new Date(state.year,state.month,0).getDate():12,values=Array(length).fill(0);rows.forEach(r=>selectedEvents(r).forEach(e=>values[Number(e.date.slice(state.period==='month'?8:5,state.period==='month'?10:7))-1]++));const max=Math.max(10,Math.ceil(Math.max(...values)/10)*10);$('#axis').innerHTML=`<span>${max}</span><span>${max/2}</span><span>0</span>`;$('#plot').style.gridTemplateColumns=`repeat(${length},minmax(0,1fr))`;$('#plot').innerHTML=values.map((v,i)=>{const k=i+1,label=state.period==='month'?`${state.month} 月 ${k} 日`:`${k} 月`;return `<button class="bar-cell" data-bin="${k}" aria-pressed="${state.filter===k}" aria-label="${label}，${v} 页，点击筛选"><span class="tip">${label} · ${v} 页</span><span class="bar" style="height:calc((100% - 24px) * ${v/max});${v===0?'opacity:0':''}"></span><span class="tick">${state.period==='year'?k+'月':k===1||k%5===0||k===length?k:''}</span></button>`}).join('');$('#chartSubtitle').textContent=`${periodLabel()} · ${state.period==='month'?'每日':'每月'}完成页数`;$('#legend').textContent=state.mode;$('#chartHint').textContent='点击柱形，筛选对应'+(state.period==='month'?'日期':'月份')+'的作品明细';$('#clearFilter').classList.toggle('hidden',state.filter===null);$('#clearFilter').textContent=`${state.filter}${state.period==='month'?' 日':' 月'} · 清除筛选`}
function filteredEvents(r){return selectedEvents(r).filter(e=>state.filter===null||Number(e.date.slice(state.period==='month'?8:5,state.period==='month'?10:7))===state.filter)}
function renderRows(rows){const visible=rows.filter(r=>filteredEvents(r).length&&`${r.title}${r.chapter}`.includes(state.search.trim())).sort((a,b)=>last(b).localeCompare(last(a)));$('#rowCount').textContent=`· ${visible.length} 话`;$('#rows').innerHTML=visible.length?visible.map(r=>`<tr><td><span class="project-name">${r.title}</span><small>${r.chapter} · ${r.mode}</small></td><td class="num"><strong>${filteredEvents(r).length}</strong> 页</td><td><span class="${isComplete(r)?'done':'pending'}">${isComplete(r)?'整话完成':`${r.events.length} / ${r.total} 页`}</span></td><td>${filteredEvents(r).at(-1).date.replaceAll('-','/')}</td><td><span class="source">${r.source}</span></td><td><button class="detail-action" data-detail="${r.id}" aria-label="查看${r.title}${r.chapter}详情">查看详情 <svg><use href="#right"/></svg></button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">没有对应的完成记录。试试其他日期或清除搜索。</td></tr>';$('#listHint').textContent=state.filter===null?'页数按所选周期统计，章节状态按当前工序显示':'已筛选'+state.filter+(state.period==='month'?'日':'月')+' · 上方汇总仍显示整个周期'}
function renderRank(n,chapters){const people=[{name:'我',value:n,chapters,self:true},{name:'阿橘',value:Math.round(n*1.34),chapters:Math.round(chapters*1.4)},{name:'白川',value:Math.round(n*.83),chapters:Math.round(chapters*.8)},{name:'小满',value:Math.round(n*1.12),chapters:Math.round(chapters*1.1)},{name:'森森',value:Math.round(n*.62),chapters:Math.round(chapters*.6)}].sort((a,b)=>b.value-a.value);$('#rankPeriod').textContent=`${periodLabel()} · ${state.mode}`;$('#selfRank').innerHTML=`第 ${people.findIndex(p=>p.self)+1} 名 <span>/ ${people.length} 份示例档案</span>`;$('#rankRows').innerHTML=people.map((p,i)=>`<tr class="${p.self?'self':''}"><td class="rank-number">${i+1}</td><td><span class="avatar">${p.name[0]}</span><strong>${p.name}</strong>${p.self?' <span class="sub">我的记录</span>':''}</td><td class="num">${fmt(p.value)} 页</td><td class="num">${p.chapters} 话</td><td><span class="rank-bar"><i style="width:${p.value/(people[0].value||1)*100}%"></i></span></td></tr>`).join('')}
function showDetail(id){const r=data.find(r=>r.id===Number(id));$('#detailTitle').textContent=r.title+' · '+r.chapter;$('#detailSubtitle').textContent=r.mode+' · 示例进度详情';const dates=[...new Set(r.events.map(e=>e.date))];$('#detailBody').innerHTML=`<div class="fact-grid"><div><small>当前进度</small><strong>${r.events.length} / ${r.total} 页</strong></div><div><small>统计时间来源</small><strong>${r.source}</strong></div><div><small>本期完成</small><strong>${selectedEvents(r).length} 页</strong></div><div><small>整话完成日期</small><strong>${isComplete(r)?last(r):'尚未全部完成'}</strong></div></div><h3>页面完成记录</h3><div class="timeline">${dates.map(date=>`<section><strong>${date}</strong><p>${r.events.filter(e=>e.date===date).map(e=>String(e.page).padStart(3,'0')+'.jpg').join('、')}</p></section>`).join('')}</div><p class="dialog-note">${r.source==='标记时间'?'按每页标记完成的日期统计。':r.source==='文件修改时间'?'按每个文件的修改日期统计。':'按手动指定的统计日期归档。'}整话全部完成后，取最后一页的统计日期作为完成日期。示例仅用于体验界面。</p>`;$('#detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){state.mode=b.dataset.mode;state.filter=null;sync()}if(b.dataset.tab){state.tab=b.dataset.tab;sync()}if(b.dataset.period){state.period=b.dataset.period;state.filter=null;sync()}if(b.dataset.bin){state.filter=state.filter===Number(b.dataset.bin)?null:Number(b.dataset.bin);render()}if(b.dataset.detail)showDetail(b.dataset.detail)});
$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};$('#clearFilter').onclick=()=>{state.filter=null;render()};$('#search').oninput=e=>{state.search=e.target.value;renderRows(currentRows())};$('#year').onchange=e=>{state.year=Number(e.target.value);if(state.year===2026)state.month=Math.min(10,state.month);state.filter=null;sync()};$('#month').onchange=e=>{state.month=Number(e.target.value);if(state.month>10&&state.year===2026)state.year=2025;state.filter=null;sync()};function move(delta){if(state.period==='year')state.year+=delta;else{state.month+=delta;if(state.month===13){state.month=1;state.year++}if(state.month===0){state.month=12;state.year--}}state.filter=null;sync()}$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#today').onclick=()=>{state.year=2026;state.month=10;state.filter=null;sync()};$('#month').innerHTML=Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('');$('#closeDetail').onclick=()=>$('#detail').close();$('#detail').onclick=e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close()}};$('#profiles').onclick=()=>{$('#detailTitle').textContent='示例档案';$('#detailSubtitle').textContent='用于预览本地排行的展示方式';$('#detailBody').innerHTML='<p class="dialog-note">当前使用“我、阿橘、白川、小满、森森”五份虚构档案。我的数据来自本页示例记录，其他成员数值为演示比例。正式版继续使用已有的档案导入与管理功能。</p>';$('#detail').showModal()};sync();
</script></body></html>
