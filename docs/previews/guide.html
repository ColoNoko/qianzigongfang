<script>
const GUIDE_DATA={"modes":["嵌字","翻译","校对","监修"],"categories":["漫画与章节","看图与操作","翻译与校对","嵌字与监修","导入与生成 PSD","进度与数据"],"articles":[{"id":"add","title":"添加你的第一部漫画","short":"添加漫画","cat":0,"desc":"把作品放进项目列表。从一本漫画到其中的一话，只需要选好目录。","section":"先认识“漫画”和“章节”","steps":[["选择漫画目录","点击“添加”，选择存放作品的文件夹。"],["确认章节","漫画是父级项目，每一话是它下面的子项目。"],["打开其中一话","点章节进入工作区，查看本话的图片与进度。"]],"result":"你会在项目列表看到漫画和章节。导入文件不会自动把未完成页面标记为已完成。","faq":[["为什么显示“未设置集数”？","可识别“第 12 话”和“[12]”等常见名称。没有明确集数的章节需要在项目信息中手动设置。"],["添加后没有图片？","检查选择的是否是作品目录，以及图片是否放在对应章节文件夹内；随后刷新章节。"]],"related":["roles","select"]},{"id":"roles","title":"选择你负责的职责","short":"选择职责","cat":0,"desc":"职责说明你在这部作品中做什么。选好后，进入作品时就能切到对应工作模式。","section":"给作品设置职责","steps":[["找到职责入口","漫画标题右侧的“＋”用于添加职责，旁边显示当前职责。"],["选择一到两个职责","试着切换下方的职责，看看进入作品后的工作内容。"],["进入作品","单职责直接进入对应模式；双职责记住这部漫画上次使用的模式。"]],"result":"每个职责独立记录完成状态。切换职责不会把翻译进度当作校对进度。","faq":[["设置里的默认职责会改掉已有作品吗？","不会。默认职责用于导入新漫画，已有作品的职责从项目列表单独调整。"],["双职责优先进入哪个？","优先恢复这部漫画上次使用的职责；尚未选择过时，按设置中的进度优先规则决定。"]],"related":["edit","typeset"]},{"id":"view","title":"打开章节，找到要处理的一页","short":"打开章节","cat":1,"desc":"缩略图用于挑选页面；图片预览用于看细节；对照视图用于检查原图和 PSD。","section":"从概览进入细节","steps":[["选择页面","在缩略图中选中要处理的图片。"],["进入预览或对照","原图与 PSD 对照显示时，两边画布保持一致。"],["调节图片","页码、缩放、恢复默认和全屏都在图片上方工具栏。"]],"result":"先选页，再处理。切换页面或工作模式后，缩放和位置恢复默认，避免沿用上一页的视角。","faq":[["滚轮是在翻页还是缩放？","由设置中的“图片预览界面滚轮操作”决定；按住 Ctrl 使用另一种操作。"],["图片太小，怎么放大？","使用图片工具栏的缩放控件，也可以按当前设置使用滚轮。恢复默认可回到初始视图。"]],"related":["select","typeset"]},{"id":"finish","title":"完成一页，并留下进度","short":"完成一页","cat":2,"desc":"完成标记表示当前职责已经处理完这一页。下面的操作演示可反复尝试，随时撤销。","section":"先处理内容，再标记完成","steps":[["处理当前页面","根据当前职责编辑译文、检查内容或在 Photoshop 中完成嵌字。"],["保存并标记","保存内容后，将本页标记为已完成当前职责。"],["需要时撤销","误操作时撤销；完成状态和对应日期一起恢复。"]],"result":"完成一页后，当前职责的进度增加。其它职责的状态保持原样。","faq":[["保存译文就等于完成全部页面吗？","不等于。请以每页当前职责的完成状态为准，整话完成需要所有页面都完成。"],["灰色虚线圆和实心圆分别是什么？","灰色虚线圆表示当前职责尚未完成，主题色实心圆表示已经完成。"]],"related":["credits","dates"]},{"id":"progress","title":"查看成果，保护你的记录","short":"查看进度","cat":5,"desc":"项目页看完成多少，成就页看何时完成，时间线帮助回顾每一段工作。","section":"让进度与时间对得上","steps":[["查看章节进度","已完成页数与总页数显示本话当前职责的进度。"],["查看成就和时间线","按统计归属日期查看成果；本话全完成后取最晚日期作为完成日期。"],["保留备份","在设置的“数据与备份”中查看自动备份和最近备份状态。"]],"result":"到这里，你已经完成从添加漫画到记录成果的一次完整流程。以后可以直接从“功能查阅”找答案。","faq":[["为什么旧作品的成就出现在今天？","默认使用标记完成的时间。可以通过“统计时间…”按文件修改时间或手动日期整理历史成果。"],["改日期会增加完成数量吗？","不会。统计日期决定成果归属哪一天，不改变已经完成的页数。"]],"related":["dates","backup"]},{"id":"select","title":"批量选择与右键操作","short":"批量选择与标记","cat":0,"desc":"管理模式用于批量整理项目；普通模式可以直接从章节右键菜单调整完成状态。","section":"先确定操作范围","steps":[["进入管理模式","启用管理后，选择需要整理的章节。"],["批量选择","按住 Shift 连续选择；Ctrl + A 全选当前项目范围。"],["执行批量操作","确认选中范围后，再标记或删除；删除需要确认。"]],"result":"只对当前选中范围执行操作。非管理模式下，章节右键菜单也可标记当前职责完成。","faq":[["管理模式下“＋”和职责按钮去哪了？","管理模式暂时隐藏这两个快捷入口，退出管理后恢复。"]],"related":["roles","finish"]},{"id":"edit","title":"翻译与校对怎么配合","short":"编辑、保存与校对","cat":2,"desc":"翻译负责形成译文，校对在原有译文上检查修改。两道职责的状态和日期分别记录。","section":"选择当前职责再编辑","steps":[["切换翻译或校对","使用图片区域的分段选择器，确认当前职责。"],["编辑对应文本","校对后可看到原译文与修改内容的对照。"],["保存内容","Ctrl + S 保存当前编辑内容，随后检查当前页完成状态。"]],"result":"可以在同一页保留翻译与校对各自的进度和完成日期。","faq":[["可以在翻译模式直接写校对内容吗？","请先切换到校对模式，避免混淆当前修改所属职责。"]],"related":["credits","finish"]},{"id":"credits","title":"为这一话署名","short":"署名","cat":2,"aliases":"译者标记 签名 翻校一体","desc":"在当前话记录翻译与校对人员，署名随译文文件保留。","section":"从工具栏打开“署名”","steps":[["点击“署名”","翻译工作区的署名入口位于撤销按钮左侧。"],["填写人员","分别填写翻译和校对；同一人负责时可使用“翻校一体”。"],["保存署名","保存至当前译文，已有完成状态与统计日期保留。"]],"result":"更新署名不会把已完成的 10 / 10 清空，也不会把所有页面重新计入今天。","faq":[["署名和设置里的个人称呼是一回事吗？","不是。署名属于当前译文；个人称呼只用于首页问候。"]],"related":["edit","dates"]},{"id":"typeset","title":"原图与 PSD 对照","short":"嵌字与监修","cat":3,"desc":"先核对原图与 PSD 是否匹配，再进入外部软件处理，或在对照视图检查成品。","section":"看清原图，也看清成品","steps":[["确认页面匹配","从章节缩略图选择当前页，检查对应 PSD。"],["进入对照视图","两侧画布等宽等高，图片工具栏横跨整个对照区域。"],["打开外部软件","“去嵌字”打开对应文件；完成检查后标记当前职责。"]],"result":"监修与嵌字的完成状态独立。工具栏始终位于图片上方，不悬浮遮挡画面。","faq":[["为什么不能打开 Photoshop？","到设置的“外部软件”检查 Photoshop 路径，确认程序仍存在。"],["没有对应 PSD 怎么办？","可以先预览原图，或通过“导入”从 LabelPlus 译文生成 PSD。"]],"related":["import","view"]},{"id":"import","title":"从 LabelPlus 译文生成 PSD","short":"导入与图源匹配","cat":4,"desc":"读入译文，匹配图片，再生成带文字图层的 PSD。先确认图源，避免把文字放到错误页面。","section":"从一份译文开始","steps":[["选择输入文件","支持 TXT、JSON、ZIP，也可以拖入文件夹或 ZIP。"],["检查图源匹配","逐页核对文件名、标签数量与匹配状态。"],["设置样式并生成","确认字体、样式和输出选项，先生成样张检查效果。"]],"result":"确认样张后再生成整话。生成后是否导入项目，按页面上对应选项决定。","faq":[["更多输出选项在哪里？","独立卡片内提供按分组创建图层组、Label 编号层、忽略无标签图片、覆盖已有 PSD 和 PPI。"],["一定要用 Photoshop 生成吗？","可以直接生成 PSD。需要 Photoshop 特定排版流程时，再配置并使用对应脚本。"]],"related":["typeset","fonts"]},{"id":"fonts","title":"准备字体与外部软件","short":"字体与生成准备","cat":4,"desc":"生成 PSD 前先确认所需字体可用。软件路径只需配置实际会用到的工具。","section":"缺什么，再配置什么","steps":[["扫描字体","在字体页面扫描可用字体，检查译文要求的字体。"],["安装缺失字体","完成安装后刷新列表，再回到导入页面选择。"],["检查软件路径","需要打开 Photoshop 时，到设置中选择正确程序。"]],"result":"字体管理通过 Windows 原生接口完成，不需要启动 PowerShell。","faq":[["找不到字体样式怎么办？","先检查该字体是否真的包含所需字重和样式，再重新扫描字体。"]],"related":["import","typeset"]},{"id":"dates","title":"把历史成果记在正确的日期","short":"统计时间","cat":5,"aliases":"日期 时间线 文件修改时间 成就 历史补录","desc":"调整成果属于哪一天，不改变已经完成多少页。四种职责分别设置。","section":"右键 → 统计时间…","steps":[["选择范围","右键漫画应用于整本，右键章节应用于单话；图片右键也能单独调整。"],["选择时间来源","标记时间、文件修改时间、手动日期，按实际情况选择。"],["查看同步结果","成就、时间线与进度详情使用一致的统计日期，调整支持撤销。"]],"result":"文件时间按每页读取并保存；整话全部完成后，最晚的统计日期就是本话完成日期。","faq":[["修改译文后，历史日期会跟着变吗？","不会持续追踪文件修改。选定文件时间后保存当时的日期，避免重存文件影响已有成果。"],["翻译和校对共用 TXT，会怎样？","整话共用一个译文文件时，文件修改时间可能相同。逐页标记时间更适合记录日常翻校进度。"],["选择手动日期会把未完成图片也完成吗？","不会。调整统计时间与标记完成是两件不同的事。"]],"related":["progress","backup"]},{"id":"backup","title":"备份与还原工作记录","short":"数据与备份","cat":5,"desc":"在整理项目、迁移数据或更换电脑之前，先确认最近的备份是否可用。","section":"在设置中管理备份","steps":[["查看最近备份","打开设置 → 数据与备份，查看自动备份与最近备份状态。"],["立即备份","重要整理前手动保留一份当前工作记录。"],["谨慎还原","选择要恢复的备份，核对时间并阅读确认提示后再执行。"]],"result":"项目状态、各职责完成信息和统计日期需要一起保护；漫画原图、PSD 和译文文件也应自行保留副本。","faq":[["备份记录等于备份所有漫画文件吗？","不等于。工作记录与原图、PSD、译文是不同的数据，请同时保管作品文件。"]],"related":["dates","progress"]}],"lessons":{"welcome":{"short":"开始","title":"认识汉化工坊","desc":"汉化工坊是一款漫画汉化项目管理工具。\n从整理文件到记录成果，让每一话的工作有序推进。","section":"从接到漫画，到交出成品","steps":[],"faq":[],"related":[],"cat":0},"add":{"short":"添加漫画","title":"把第一部漫画放进工坊","desc":"先添加作品目录，再打开其中一话。","section":"试着加入「星海来信」","steps":[["点“添加”","在项目列表上方打开目录选择。"],["选作品文件夹","选择「星海来信」，里面已经分好了章节。"],["打开第 1 话","读取后，点击「第 1 话 · 起点」，查看里面的 3 张图片。"]],"faq":[["作品目录该选哪一层？","选包含各话文件夹的「星海来信」。每个子文件夹对应一话，图片放在该话里面。"],["文件夹名字没有话数怎么办？","添加后编辑章节信息，填入集数和标题。"]],"cat":0},"roles":{"short":"选择职责","title":"告诉工坊，你负责哪一步","desc":"同一部漫画可以有不同职责。先选择本次要练习的职责。","section":"在漫画标题右侧选择","steps":[["点漫画旁边的“＋”","新版已将“＋”移到漫画旁的“⋯”菜单，选择“修改职责”。本练习的“＋”演示相同操作。"],["选择你负责的职责","嵌字处理图片文字；翻译写译文；校对修订译文；监修检查成品。"],["进入对应模式","点击职责按钮选择当前职责，后面的教程会跟着切换。"]],"faq":[["一个人负责翻译和校对怎么选？","给作品同时添加“翻译”和“校对”。两道职责分别记录进度，处理页面时切换当前模式。"]],"cat":0},"view":{"short":"打开工作区","title":"找到这一话，选中这一页","desc":"章节决定处理哪一话，页码决定处理哪一张。","section":"先把画面看清楚","steps":[["选择第 1 页","点左侧缩略图或上方页码，两处会同步选中。"],["放大图片","点击“＋”或按住 Ctrl 滚动鼠标滚轮，居中放大图片；“复位”回到整页。"],["切换对照","对照视图同时显示原图和 PSD，方便检查对应位置。"]],"faq":[["滚轮是在翻页还是缩放？","在设置 → 外观与看图 → 图片预览界面滚轮操作中选择。按住 Ctrl 使用另一种操作。"]],"cat":1},"finish":{"short":"完成第一页","title":"处理这一页，再标记完成","desc":"完成内容和记录状态是两个步骤。右侧练习会显示它们各自的结果。","section":"完成当前职责","steps":[],"faq":[["标错了怎么办？","点击“撤销”，或再次点击完成按钮，把这一页恢复为未完成。"]],"cat":2},"wrap":{"short":"整话收尾","title":"从一页完成，到整话完成","desc":"把剩余页面处理完，再检查这一话的进度和统计日期。","section":"检查交付前的三个地方","steps":[["补齐未完成页面","右侧逐页显示当前职责状态。处理完一页，再点该页的完成按钮。"],["核对整话进度","达到 3 / 3 后显示“整话完成”；撤销一页就会恢复“进行中”。"],["核对统计时间","右键点击章节，展开“统计时间…”，选择标记时间、文件修改时间或手动日期。"]],"faq":[["整话完成日期取哪一天？","所有页面完成后，取这些页面中最晚的统计日期。"],["翻译完成，为什么校对还是 0？","翻译和校对是独立职责。切换模式后看到的是该职责自己的进度。"]],"cat":5},"return":{"short":"下次继续","title":"下次打开，直接接着做","desc":"从首页找回最近章节，用进度页找未完成的工作。","section":"记住这三个入口","steps":[["首页：继续上次工作","直接打开最近处理的章节。设置中可以选择启动后进入首页或项目。"],["进度：查看待办","按职责筛选进行中的漫画，展开后定位未完成章节。"],["设置：数据与备份","查看最近备份，整理项目之前可以手动备份一次。"]],"faq":[["备份里包含什么？","保存项目与工作记录。原图、PSD 和译文文件仍放在你的漫画目录里。"]],"cat":5}},"flowSteps":{"嵌字":[["打开对应 PSD","点击“去嵌字”，在 Photoshop 中处理这一页的文字。"],["保存后刷新成品","保存 PSD 并返回工坊，点击刷新，查看更新后的成品。"],["检查并标记完成","打开原图与 PSD 对照，检查排版后标记嵌字完成。"]],"翻译":[["添加锚点，定位文字","开启“标点”，在原图文字位置单击添加框内锚点；右键可添加框外锚点。"],["双击锚点或译文编辑","双击图片上的编号，或右侧对应译文，打开文本框。输入后 Ctrl + S 保存。"],["记录本页翻译完成","检查这一页的各条译文，点击“标记翻译完成”。"]],"校对":[["选中需要校对的译文","点击原图编号或右侧条目，核对原图与现有译文。"],["双击修改，保存校对","双击条目修改措辞；保存后查看原译文与校对后文本。"],["检查修改，完成本页","逐条确认修改结果，再标记这一页校对完成。"]],"监修":[["打开原图与 PSD 对照","对照两侧相同位置，检查内容是否完整、排版是否合适。"],["放大检查细节","放大成品，检查文字边缘、位置和遗漏。"],["记录检查结果","有问题就保留未完成；确认通过后标记监修完成。"]]},"referenceInfo":{"add":{"entry":"项目 → 添加","practice":"add","details":[["目录怎么选","选择包含各话文件夹的作品目录；进入章节后，原图与 PSD 按页面组织。"],["章节信息","没有识别出话数时，在项目信息中补充集数和标题。"],["更新文件","往目录加入文件后刷新章节；添加文件和标记完成是两个操作。"]]},"roles":{"entry":"项目 → 漫画标题右侧 ＋","practice":"roles","details":[["作品职责与当前模式","职责属于这部作品；当前模式决定你正在编辑和统计哪一道职责。"],["双职责","一部作品最多选择两个职责。自动进入较快或较慢的职责，可在设置中调整。"],["默认职责","设置中的默认职责用于新添加的漫画；已有作品在标题旁单独修改。"]]},"view":{"entry":"项目 → 章节 → 图片预览","practice":"view","details":[["选页与缩放","页码和缩略图用于换页，＋／－用于缩放图片，复位回到整页。"],["滚轮规则","默认练习使用 Ctrl＋滚轮缩放。正式项目可在设置中选择滚轮翻页或缩放，Ctrl 切换另一种操作。"],["翻译工作区","图上编号对应右侧文字。单击选中，双击编号或文字进入编辑。"]]},"finish":{"entry":"项目 → 章节 → 右上角完成按钮","practice":"finish","details":[["四道职责独立","翻译、校对、嵌字、监修各自记录完成状态；完成翻译不会同时完成校对。"],["内容与状态","先保存内容，再检查这一页的完成状态。整话完成需要所有页面都完成。"],["误标处理","再次点击完成标记可以恢复未完成；不要为了改日期而反复标记。"]]},"select":{"entry":"项目列表 → 管理；章节右键菜单","details":[["管理模式","启用管理后出现选择控件，职责的 ＋ 和快捷按钮暂时隐藏；退出管理即可恢复。"],["连续选择","先选起点，按住 Shift 再选终点；Ctrl＋A 全选当前范围。输入框中的全选仍是选择文字。"],["批量标记","先核对选中范围与当前职责，再执行标记。删除项目会另行确认。"]]},"edit":{"entry":"项目 → 章节 → 翻译／校对","practice":"finish","details":[["添加锚点","开启“标点”，在原图文字位置单击添加框内锚点，右键添加框外锚点。编号与右侧文字条目对应。"],["进入编辑","单击锚点或条目只选中；双击锚点或条目打开文本框。Ctrl＋S 保存当前编辑内容。"],["校对对照","切到校对后查看原译文与修订内容。双击条目编辑新译文，保存后查看修改对照。"],["标点快捷操作","在图上可用 Tab 切换标点工具。先确认当前职责，再新增或修改文字。"]]},"credits":{"entry":"翻译工作区 → 署名（撤销左侧）","details":[["按话保存","翻译与校对人员保存在当前译文中，属于当前章节。"],["翻校一体","同一人负责翻译和校对时，用“翻校一体”填入同名署名。"],["与进度的关系","保存署名保留已有完成标记和统计日期；首页的个人称呼不会替代作品署名。"]]},"typeset":{"entry":"项目 → 章节 → 嵌字／监修","practice":"finish","details":[["嵌字流程","打开对应 PSD，在 Photoshop 中处理文字，保存后返回工坊刷新成品，再标记完成。"],["监修流程","对照原图与 PSD 检查缺字、错字和排版。发现问题先保留未完成，通过后再标记监修完成。"],["找不到 PSD","确认原图和成品的匹配关系；还没有 PSD 时可先通过“导入”生成。"],["外部软件","Photoshop 无法打开时，在设置的外部软件中检查程序路径。"]]},"import":{"entry":"左侧 导入 → 读取 LabelPlus 译文","details":[["图源匹配","核对文件名、标签数与图源；可选择匹配方式和强制图源后缀。先处理未匹配的页面。"],["文字分组","框内与框外可分别选择；仅需要其中一组时取消另一组。"],["文字样式","检查字体、字重、字号、行距、文字方向、对齐、填充与描边。先用一页生成样张。"],["输出选项","按分组创建图层组、额外生成 Label 编号层、忽略无标签图片、覆盖已有 PSD 和 PPI 各自独立。"],["导入项目","“生成后导入项目”决定是否把生成结果加入项目；生成 PSD 本身不代表完成嵌字。"]]},"fonts":{"entry":"左侧 字体；设置 → 外部软件","details":[["查找字体","按全部、系统、用户、本应用筛选字体，再查看字体名称、样式和来源。"],["预览范围","预览文字是“嵌字工坊 字体预览 123 ABC”。缺字提示说明该字体不包含某些字符，需检查实际用字。"],["安装后刷新","安装字体后重新扫描，回到导入页检查字体和样式是否可选。"],["字体与软件分开","字体是否可用与 Photoshop 路径是两项配置；打开外部软件时才需要其程序路径。"]]},"dates":{"entry":"漫画／章节／图片右键 → 统计时间…","practice":"wrap","details":[["标记时间","按每页实际点击完成的时间归档，适合日常工作。"],["文件修改时间","读取文件当时的修改时间并保存。以后重存文件，不会持续改写已经选定的统计日期。"],["手动日期","为历史成果选择归属日期。仅调整日期，不把未完成页面变为完成。"],["范围与职责","漫画、章节、图片对应不同范围；翻译、校对等职责分别设置。整话全部完成后，取最晚统计日期。"]]},"progress":{"entry":"左侧 进度／成就","practice":"return","details":[["进度找待办","选择职责，再按进行中、未开始、已完成等状态筛选。展开作品查看章节，继续未完成的工作。"],["日期锚点","进度中的最近操作按最近完整处理章节的修改日期判断，不以最近打开时间代替。"],["成就看成果","按统计日期查看本期页数、完成趋势和排行；搜索或筛选作品明细帮助定位具体章节。"],["改日期后","成果会归入新的统计周期；已完成数量不因日期变化而增加。"]]},"backup":{"entry":"设置 → 数据与备份","details":[["备份时机","整理项目或迁移前，点“立即备份”，再到备份管理核对最新一份。"],["还原范围","还原工作记录，包括项目状态和完成信息。选择备份时间后按确认提示执行。"],["作品文件","漫画原图、PSD 与译文仍在作品目录；工作记录备份不能替代这些文件的副本。"]]}},"SAMPLE_IMAGE":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4QA+RXhpZgAASUkqAAgAAAABADEBAgAcAAAAGgAAAAAAAABCYW5kaVZpZXcgNy4yNCAocXVhbGl0eTogODAp/9sAQwAGBAUGBQQGBgUGBwcGCAoQCgoJCQoUDg8MEBcUGBgXFBYWGh0lHxobIxwWFiAsICMmJykqKRkfLTAtKDAlKCko/9sAQwEHBwcKCAoTCgoTKBoWGigoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgo/8AAEQgDAAJAAwERAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBR function advanceLesson(event){
 const type=activeType(),textMode=['翻译','校对'].includes(w.mode),quick=route.section==='quick';
 if(type==='add'){
  if(event==='folder-open')moveLessonStep(1,{focus:false});
  if(event==='folder-read')moveLessonStep(2);
  if(event==='chapter-open')moveLessonStep(2,{ready:quick});
 }else if(type==='roles'){
  if(event==='duties-open')moveLessonStep(1,{focus:false});
  if(event==='duty-chosen')moveLessonStep(2);
 }else if(type==='view'){
  if(event==='page-selected'){ui.viewPageChosen=true;moveLessonStep(textMode?0:1);}
  if(event==='image-zoomed'&&!textMode)moveLessonStep(2,{ready:quick?flow.viewCompared:false});
  if(event==='comparison-shown'&&!textMode){if(ui.compare)flow.viewCompared=true;moveLessonStep(2,{ready:quick&&flow.viewCompared});}
  if(event==='anchor-selected')moveLessonStep(1,{focus:false});
  if(event==='entry-selected'||event==='editor-open')moveLessonStep(2,{focus:false});
  if(event==='text-saved')moveLessonStep(2,{ready:quick});
 }else if(type==='finish'){
  if(event==='workspace-entered'||event==='page-selected')moveLessonStep(workStep(0));
  if(event==='anchor-selected'||event==='entry-selected'||event==='anchor-added'||event==='editor-open')moveLessonStep(workStep(1),{focus:false});
  if(event==='text-saved'||event==='psd-refreshed')moveLessonStep(workStep(2));
  if(event==='psd-saved')moveLessonStep(workStep(1));
  if(event==='page-completed')moveLessonStep(workStep(2),{ready:quick});
  if(event==='page-unmarked'){flow.nextReady=false;moveLessonStep(workStep(2),{focus:false});}
 }else if(type==='wrap'){
  if(event==='completion-changed')moveLessonStep(count()===3?1:0,{focus:count()===3});
  if(event==='dates-editing')moveLessonStep(2,{focus:false});
  if(event==='dates-applied')moveLessonStep(2,{ready:quick});
 }else if(type==='return'){
  if(event==='home-opened'){flow.returnHomeSeen=false;flow.returnBackupDone=false;moveLessonStep(0);}
  if(event==='progress-opened'){flow.returnHomeSeen=true;moveLessonStep(2);}
  if(event==='settings-opened')moveLessonStep(2);
  if(event==='backup-created'){flow.returnBackupDone=true;moveLessonStep(2,{ready:quick});}
 }
}

if(a==='configure'){ui.softwareFolderSelected=false;ui.step=2;openModal('选择 Photoshop 文件夹',`<div class="folder-path">此电脑 › Apps</div><button class="folder-row" data-action="choose-software-folder">${icons.folder}<strong>Photoshop</strong><span>文件夹</span></button><p>选择包含 Photoshop.exe 的示例文件夹。这里只演示路径选择，不会读取电脑目录。</p>`,btn('取消','close-modal')+btn('使用此文件夹','confirm-software-folder','class="primary" disabled'),{kind:'software-folder'});return;}
if(a==='choose-software-folder'){ui.softwareFolderSelected=true;$('[data-action=choose-software-folder]').setAttribute('aria-pressed','true');$('[data-action=confirm-software-folder]').disabled=false;applyTaskHighlight();return;}
if(a==='confirm-software-folder'){if(ui.modal!=='software-folder'||!ui.softwareFolderSelected)return;w.pathConfigured=true;ui.notice='已选择 Photoshop 文件夹，程序路径为 C:/Apps/Photoshop/Photoshop.exe。';closeModal();requestTaskFocus('#softwarePath');}
if(ui.modal==='viewer'&&['zoom-in','zoom-out','reset-zoom','compare'].includes(a)){$('#modal .modal-body').innerHTML=pageTools()+pictures();fitImages();renderPractice();return;}
renderPractice();}
// One delegated event handler per event type; no competing legacy handlers.
document.addEventListener('click',e=>{if(e.target.closest('.skip-link')){e.preventDefault();$('#main').focus();return;}const b=e.target.closest('button');if(!b){if(e.target===$('#modal')&&ui.modal==='editor')saveEditor();else if(e.target===$('#modal'))closeModal();return;}if(b.disabled)return;
if(b.dataset.route){const [section,id]=b.dataset.route.split('/');navigate(section,id);return;}
if(b.id==='quick'||b.id==='reference'){navigate(b.id,b.id==='quick'?'welcome':article(route.id)?route.id:'add');return;}
if(b.id==='theme'){state.theme=state.theme==='dark'?'light':'dark';updateThemeIcon();document.documentElement.dataset.theme=state.theme;b.setAttribute('aria-label',state.theme==='dark'?'切换浅色模式':'切换深色模式');b.setAttribute('aria-pressed',state.theme==='dark');persist();return;}
if(b.dataset.mode){setMode(b.dataset.mode);return;}
if(b.dataset.duty){const m=b.dataset.duty;if(w.duties.includes(m)){if(w.duties.length===1){tell('至少保留一个职责。');return;}w.duties=w.duties.filter(x=>x!==m);if(w.mode===m)w.mode=w.duties[0];}else if(w.duties.length<2){w.duties.push(m);w.mode=m;}ui.dutyOpen=false;advanceLesson('duty-chosen');ui.notice='已选：'+w.duties.join('、')+'。点击“进入'+w.mode+'”继续。';renderPractice();return;}
if(b.dataset.step!==undefined){selectLessonStep(Number(b.dataset.step));return;}
if(b.dataset.openChapter){w.chapter=Number(b.dataset.openChapter);w.page=1;ui.opened=true;advanceLesson('chapter-open');ui.notice='已打开'+titleChapter()+'，共 3 页。';renderPractice();return;}
if(b.dataset.pageCard){w.page=Number(b.dataset.pageCard);$$('[data-page-card]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pageCard===b.dataset.pageCard));persist();return;}
if(b.dataset.label){ui.label=Number(b.dataset.label);$$('[data-label]').forEach(x=>{x.classList.toggle('selected',Number(x.dataset.label)===ui.label);x.setAttribute('aria-pressed',Number(x.dataset.label)===ui.label)});const edit=$('[data-action=edit-entry]');if(edit)edit.textContent='编辑标签 '+ui.label;advanceLesson(b.dataset.labelKind==='entry'?'entry-selected':'anchor-selected');tell('已选中标签 '+ui.label+'。双击条目或点击“编辑”修改。');settleLessonUI();return;}
if(b.dataset.continuePage){completeWrapPage(Number(b.dataset.continuePage));return;}
if(b.dataset.cancelPage){markPage(Number(b.dataset.cancelPage),false);renderPractice();return;}
if(b.dataset.tab){cancelLessonTimer();flow.nextReady=false;flow.returnBackupDone=false;ui.tab=b.dataset.tab;ui.notice='';advanceLesson(ui.tab==='首页'?'home-opened':ui.tab==='进度'?'progress-opened':'settings-opened');renderPractice();return;}
if(b.dataset.batch){const n=Number(b.dataset.batch);if(ui.manage){w.batchSelected=e.shiftKey?[1,2]:w.batchSelected.includes(n)?w.batchSelected.filter(x=>x!==n):[...w.batchSelected,n];ui.step=1;}else ui.notice='先进入管理模式，再选择章节执行批量操作。';renderPractice();return;}
if(b.dataset.restore!==undefined){const n=Number(b.dataset.restore);confirm('还原这份练习备份？','将用 '+esc(w.backups[n].time)+' 的模拟记录覆盖当前练习的文本、职责、进度和统计日期。阅读标记保留。','confirm-restore','还原练习记录');$('#modal').dataset.restore=n;return;}
if(b.dataset.psTool){ui.psTool=b.dataset.psTool;$$('[data-ps-tool]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.psTool===ui.psTool));if(ui.psTool==='文字')$('#psDraft').focus();if(ui.psTool==='缩放'){ui.psZoom=!ui.psZoom;$('.ps-sheet').style.width=ui.psZoom?'280px':'210px';}applyTaskHighlight();return;}
if(b.dataset.action)handleAction(b.dataset.action);
});
document.addEventListener('dblclick',e=>{const p=e.target.closest('[data-page-card]'),l=e.target.closest('[data-label]'),folder=e.target.closest('[data-action=choose-folder]');if(p&&p.dataset.enter==='true'){w.page=Number(p.dataset.pageCard);enterWorkspace();}if(l){ui.label=Number(l.dataset.label);openEditor();}if(folder){$('.folder-children').hidden=false;$('.folder-path').textContent='此电脑 › 漫画 › 星海来信';}});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(f==='date'||f==='demo-date'){cancelLessonTimer();if(f==='date'){advanceLesson('dates-editing');const k=`${w.chapter}:${w.mode}`;w.dateRule[k]??={source:'手动日期',date:''};w.dateRule[k].date=e.target.value;}else dateExample().date=e.target.value;persist();applyTaskHighlight();return;}if(e.target.id==='entryDraft'&&ui.editor)ui.editor.draft=e.target.value;if(e.target.id==='psDraft'){w.psDraft[ui.psKey||pageKey()]=e.target.value;$('#psText').textContent=e.target.value;persist();}if(['translator','proofreader'].includes(f)){w.credits[f]=e.target.value;if(f==='translator'&&w.credits.same){w.credits.proofreader=e.target.value;$('[data-field=proofreader]').value=e.target.value;}persist();}});
document.addEventListener('change',e=>{const f=e.target.dataset.field;if(e.target.id==='psVisible'){ui.psHidden=!e.target.checked;$('#psText').hidden=ui.psHidden;}if(!f)return;if(f==='page'){setPage(e.target.value);return;}if(f==='same'){w.credits.same=e.target.checked;if(w.credits.same)w.credits.proofreader=w.credits.translator;}if(f==='font')w.font=e.target.value;if(['inside','outside'].includes(f)){w.groups[f]=e.target.checked;persist();}if(f==='source'||f==='date'){cancelLessonTimer();advanceLesson('dates-editing');const k=`${w.chapter}:${w.mode}`;w.dateRule[k]??={source:'标记时间',date:today()};w.dateRule[k][f]=e.target.value;}if(f==='demo-source')dateExample().source=e.target.value;if(f==='demo-date')dateExample().date=e.target.value;if(f==='date'||f==='demo-date'){persist();applyTaskHighlight();return;}if(f==='source'&&e.target.value==='手动日期')requestTaskFocus('[data-field="date"]');if(f==='demo-source'&&e.target.value==='手动日期')requestTaskFocus('[data-field="demo-date"]');ui.notice='';if(!['inside','outside'].includes(f))renderPractice();});
function anchorAt(e,outside){const s=e.target.closest('[data-anchor-surface]');if(!s||!ui.addAnchor||w.mode!=='翻译'||e.target.closest('button'))return false;e.preventDefault();const rect=s.getBoundingClientRect();addAnchor(outside,(e.clientX-rect.left)/rect.width*100,(e.clientY-rect.top)/rect.height*100);return true;}
document.addEventListener('pointerup',e=>{if(ui.dutyOpen&&!e.target.closest('#dutyTools')){ui.dutyOpen=false;$('.duty-picker')?.remove();$$('[data-action=duties]').forEach(b=>b.setAttribute('aria-expanded','false'));applyTaskHighlight();}if(e.button===0)anchorAt(e,false);});
document.addEventListener('contextmenu',e=>{if(anchorAt(e,true))return;if(e.target.closest('#dutyTools')){e.preventDefault();ui.dutyOpen=true;renderPractice();}if(e.target.closest('#chapterContext')){e.preventDefault();handleAction('time-settings');}});
document.addEventListener('keydown',e=>{const editing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#modal').open)return;$('#search').focus();$('#search').select();return;}if(mod&&e.key.toLowerCase()==='s'&&ui.editor){e.preventDefault();saveEditor();return;}if(mod&&e.key.toLowerCase()==='s'&&ui.modal==='photoshop'){e.preventDefault();handleAction('save-psd');return;}if(e.key==='Escape'&&e.target===$('#search')){e.preventDefault();$('#search').value='';navigate(previousRoute.section==='search'?'quick':previousRoute.section,previousRoute.section==='search'?'welcome':previousRoute.id,{replace:true});return;}if(e.key==='Enter'&&e.target.matches('[data-page-card][data-enter=true]')){e.preventDefault();enterWorkspace();return;}if(mod&&e.key.toLowerCase()==='a'&&ui.manage&&activeType()==='select'&&!editing){e.preventDefault();handleAction('select-all');return;}if(e.key==='Enter'&&e.target.matches('[data-label]')){e.preventDefault();openEditor();return;}if(e.key==='Tab'&&!e.shiftKey&&e.target.matches('.image-viewport')&&w.mode==='翻译'&&['view','finish'].includes(activeType())){e.preventDefault();ui.addAnchor=!ui.addAnchor;renderPractice();$('[data-action=anchor-tool]')?.focus();return;}if(e.key==='Escape'&&ui.dutyOpen){ui.dutyOpen=false;renderPractice();$('[data-action=duties]')?.focus();return;}if(e.key==='Escape'&&ui.addAnchor){ui.addAnchor=false;renderPractice();}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();const editor=ui.modal==='editor';closeModal();if(editor)tell('本次未保存输入已放弃，原有译文保持不变。');});
$('#modal').addEventListener('close',()=>{if($('#modal').open)return;ui.modal=null;ui.editor=null;ui.psKey=null;settleLessonUI();});
document.addEventListener('wheel',e=>{if(e.ctrlKey&&e.target.closest('.image-viewport')&&!['翻译','校对'].includes(w.mode)){e.preventDefault();ui.scale=Math.max(.5,Math.min(3,ui.scale+(e.deltaY<0?.25:-.25)));advanceViewerStep('zoom');if(ui.modal==='viewer')$('#modal .modal-body').innerHTML=pageTools()+pictures();renderPractice();fitImages();}},{passive:false});
document.addEventListener('scroll',e=>{const v=e.target;if(!v.matches?.('.image-viewport'))return;const pair=v.closest('.pictures.comparison');if(!pair)return;const x=v.scrollLeft/Math.max(1,v.scrollWidth-v.clientWidth),y=v.scrollTop/Math.max(1,v.scrollHeight-v.clientHeight);pair.querySelectorAll('.image-viewport').forEach(other=>{if(other===v)return;const l=x*(other.scrollWidth-other.clientWidth),t=y*(other.scrollHeight-other.clientHeight);if(Math.abs(other.scrollLeft-l)>1)other.scrollLeft=l;if(Math.abs(other.scrollTop-t)>1)other.scrollTop=t;});},true);
$('#category').addEventListener('change',e=>{const a=articles.find(a=>a.cat===Number(e.target.value));navigate('reference',a.id);});
let searchTimer;
$('#search').addEventListener('input',e=>{cancelLessonTimer();flow.focus=null;clearTimeout(searchTimer);const query=e.target.value.trim();searchTimer=setTimeout(()=>{if(query){if(route.section!=='search'){previousRoute={...route};history.pushState(null,'',routeHash({section:'search',id:query}));}else history.replaceState(null,'',routeHash({section:'search',id:query}));route={section:'search',id:query};nav();renderSearch();}else if(route.section==='search'){const old={...previousRoute};navigate(old.section==='search'?'quick':old.section,old.section==='search'?'welcome':old.id,{replace:true,focus:false});}else syncLessonTimer();},120);});
function renderSearch(){const query=route.id,tokens=query.toLocaleLowerCase().split(/\s+/).filter(Boolean);$('#search').value=query;const found=articles.filter(a=>{const info=referenceInfo[a.id];const all=[a.title,a.short,a.desc,a.aliases,...a.steps.flat(),...a.faq.flat(),info.entry,...info.details.flat()].join(' ').toLocaleLowerCase();return tokens.every(t=>all.includes(t));});$('#main').innerHTML=`<div class="article-scroll" id="articleScroll"><div class="article-inner"><header class="article-head"><div class="eyebrow">功能查阅 / 搜索</div><h1 id="pageTitle" tabindex="-1">找到 ${found.length} 篇相关指引</h1><p class="lead">搜索“${esc(query)}” · 按 Esc 返回刚才的页面</p></header><div class="search-list">${found.map(a=>`<button class="search-result" data-route="reference/${a.id}"><strong>${esc(a.title)}</strong><span>${esc(a.desc)}</span><small>${esc(referenceInfo[a.id].entry)} →</small></button>`).join('')||'<div class="empty-state"><strong>没有找到匹配内容</strong><p>试试“锚点”“统计时间”“署名”或“备份”，也可以减少关键词。</p></div>'}</div></div></div>`;}
addEventListener('popstate',()=>{clearTimeout(searchTimer);if(ui.editor)saveEditor(false);if($('#modal').open)closeModal();route=parseRoute();if(route.section==='search')$('#search').value=route.id;enterRoute(false);});
addEventListener('hashchange',()=>{clearTimeout(searchTimer);const next=parseRoute();if(next.section!==route.section||next.id!==route.id){if(ui.editor)saveEditor(false);if($('#modal').open)closeModal();route=next;enterRoute(false);}});
document.addEventListener('animationend',e=>{if(e.animationName==='guide-control-confirm')e.target.classList.remove('control-confirm-pulse');});
addEventListener('pagehide',()=>{cancelLessonTimer();clearTimeout(searchTimer);});
addEventListener('pageshow',e=>{if(e.persisted)syncLessonTimer();});
addEventListener('resize',fitImages);
route=parseRoute();history.replaceState(null,'',routeHash(route));enterRoute(false);

</script>
