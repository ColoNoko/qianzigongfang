let works,history=[],events=[];const state={mode:'嵌字',filter:'全部',query:'',sort:'recent',expanded:new Set(['w0']),active:null,range:'recent'};
function init(){works=definitions.map((d,i)=>({id:'w'+i,title:d[0],duties:d[1],chapters:d[2].map((v,c)=>({id:'w'+i+'c'+c,title:`第 ${i*3+c+1} 话 · ${['起点','晚风','归途','新的约定'][c]}`,total:v[0],done:Object.fromEntries(modes.map((m,mi)=>[m,mi===0?v[1]:Math.max(0,Math.min(v[0],v[1]+(mi===1?4:mi===2?-4:-7)))])),last:Object.fromEntries(modes.map((m,mi)=>[m,(mi===0?v[1]:Math.max(0,Math.min(v[0],v[1]+(mi===1?4:mi===2?-4:-7))))>0?today-(d[3]+c*2+mi)*day:null]))}))}));events=[];works.forEach((w,i)=>w.chapters.forEach((c,ci)=>w.duties.forEach(m=>{if(c.done[m])events.push({work:w.id,title:w.title,chapter:c.title,mode:m,count:c.done[m],at:c.last[m]-(i===4?20*day:0),source:i===4?'手动日期':i%3===1?'文件修改时间':'标记时间'})})));history=[];state.active=null;state.expanded=new Set(['w0']);}
function facts(w){const chapters=w.chapters,done=chapters.reduce((n,c)=>n+c.done[state.mode],0),total=chapters.reduce((n,c)=>n+c.total,0),complete=chapters.filter(c=>c.done[state.mode]>=c.total).length,times=chapters.map(c=>c.last[state.mode]).filter(t=>t!==null),last=times.length?Math.max(...times):null;return {done,total,complete,remaining:total-done,last,status:done===total?'已完成':done===0?'未开始':'进行中',idle:done<total&&last!==null&&today-last>=30*day}}
const date=at=>new Date(at).toISOString().slice(0,10);function ago(at){if(at===null)return '尚无操作';const d=Math.floor((today-at)/day);return d===0?'今天':d===1?'昨天':d+' 天前'}
function scope(){return works.filter(w=>w.duties.includes(state.mode))}function visible(){return scope().filter(w=>{const f=facts(w);return (state.filter==='全部'||state.filter==='久未处理'&&f.idle||f.status===state.filter)&&(w.title+' '+w.chapters.map(c=>c.title).join(' ')).includes(state.query.trim())}).sort((a,b)=>{const x=facts(a),y=facts(b);return state.sort==='remaining'?y.remaining-x.remaining:state.sort==='idle'?(x.last??-Infinity)-(y.last??-Infinity):(y.last??-Infinity)-(x.last??-Infinity)})}
function progress(done,total,unit='话'){return `<div class="progress-top"><span><strong>${done}</strong> / ${total} ${unit}</span><small>${Math.round(done/total*100)}%</small></div><div class="progress-track"><i style="width:${done/total*100}%"></i></div>`}
function render(){const all=scope(),fs=all.map(facts),remaining=fs.reduce((n,f)=>n+f.remaining,0),pending=all.reduce((n,w)=>n+w.chapters.filter(c=>c.done[state.mode]<c.total).length,0);$('#modes').innerHTML=modes.map(m=>`<button data-mode="${m}" aria-pressed="${m===state.mode}">${m}</button>`).join('');$('#scopeNote').textContent='只显示包含“'+state.mode+'”职责的作品';$('#summary').innerHTML=`<span><strong>${fs.filter(f=>f.remaining>0).length}</strong> 部待处理</span><span><strong>${pending}</strong> 话未完成</span><span><strong>${remaining}</strong> 页剩余</span><small>当前工序汇总 · 不随下方筛选变化</small>`;$('#filters').innerHTML=['全部','进行中','未开始','已完成','久未处理'].map(s=>`<button data-filter="${s}" aria-pressed="${state.filter===s}">${s}${s==='久未处理'?' '+fs.filter(f=>f.idle).length:''}</button>`).join('');const list=visible();$('#resultCount').textContent='· '+list.length+' 部';$('#works').innerHTML=list.length?list.map(w=>{const f=facts(w),expanded=state.expanded.has(w.id);return `<article class="work"><div class="list-grid work-row"><div class="work-title"><button class="expand" data-expand="${w.id}" aria-expanded="${expanded}" aria-controls="chapters-${w.id}" aria-label="${expanded?'收起':'展开'}${w.title}章节"><svg><use href="#chevron"/></svg></button><div style="min-width:0"><div class="work-name">${w.title}</div><div class="role-list">${w.duties.map(m=>`<span class="role-tag ${m===state.mode?'current':''}">${m}</span>`).join('')}<span class="row-meta">${f.status}</span></div><p class="mobile-meta">剩余 ${f.remaining} 页 · ${ago(f.last)}</p></div></div><div class="progress-cell">${progress(f.complete,w.chapters.length)}</div><div class="remain">${f.remaining?f.remaining+' 页':'—'}</div><div class="idle ${f.idle?'warn':''}">${ago(f.last)}${f.idle?'<small style="display:block;color:inherit">久未处理</small>':''}</div><button class="action ${f.remaining?'primary':''}" data-continue="${w.id}">${f.remaining?(f.status==='未开始'?'开始处理':'继续处理'):'查看章节'}</button></div><section class="chapters ${expanded?'':'hidden'}" id="chapters-${w.id}"><div class="chapter-heading"><strong>章节 · ${state.mode}</strong><p>优先继续最近操作过的未完成章节</p></div>${w.chapters.map(c=>`<div class="chapter-row"><span class="chapter-name">${c.title}</span><div class="progress-cell">${progress(c.done[state.mode],c.total,'页')}</div><span class="chapter-date">最近操作：${ago(c.last[state.mode])}</span><button class="action ghost" data-chapter="${c.id}">${c.done[state.mode]===c.total?'查看':c.done[state.mode]===0?'开始':'继续'}<svg><use href="#chevron"/></svg></button></div>`).join('')}</section></article>`}).join(''):'<div class="zero-state"><strong>没有符合条件的作品</strong><p>试试其他工序，或清除当前状态和搜索条件。</p><button id="clear">清除筛选</button></div>';}
function active(){for(const w of works){const c=w.chapters.find(c=>c.id===state.active);if(c)return {w,c}}return null}
function renderChapter(message=''){const a=active();if(!a)return;const {w,c}=a,n=c.done[state.mode];$('#chapterTitle').textContent=w.title+' · '+c.title;$('#chapterSubtitle').textContent=state.mode+' · 示例工作区';$('#chapterCount').textContent=n+' / '+c.total;$('#chapterProgress').innerHTML=`<i style="width:${n/c.total*100}%"></i>`;$('#pageTiles').innerHTML=Array.from({length:c.total},(_,i)=>`<span class="page-tile ${i<n?'finished':i===n?'next':''}" aria-label="第 ${i+1} 页${i<n?'已完成':'未完成'}">${String(i+1).padStart(3,'0')}</span>`).join('');$('#mark').disabled=n===c.total;$('#mark').textContent=n===c.total?'本章已完成':'模拟完成一页';$('#undo').disabled=!history.length;$('#notice').textContent=message;}
function openChapter(id){state.active=id;renderChapter();$('#chapter').showModal()}
function continueWork(id){const w=works.find(w=>w.id===id),pending=w.chapters.filter(c=>c.done[state.mode]<c.total).sort((a,b)=>(b.last[state.mode]??-Infinity)-(a.last[state.mode]??-Infinity));if(pending.length)openChapter(pending[0].id);else {state.expanded.add(id);render();document.getElementById('chapters-'+id).scrollIntoView({block:'nearest',behavior:'smooth'})}}
function renderTimeline(){const all=events.filter(e=>e.mode===state.mode&&(state.range==='all'||today-e.at<=30*day)).sort((a,b)=>b.at-a.at);$('#timelineSubtitle').textContent=state.mode+' · 按日期、作品与工序归档';document.querySelectorAll('[data-range]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.range===state.range));const dates=[...new Set(all.map(e=>date(e.at)))];$('#timelineBody').innerHTML=dates.length?dates.map(d=>{const rows=all.filter(e=>date(e.at)===d),ids=[...new Set(rows.map(e=>e.work))];return `<section class="timeline-group"><h3>${d}</h3>${ids.map(id=>{const entries=rows.filter(e=>e.work===id);return `<div class="timeline-entry"><div class="row"><strong>${entries[0].title}</strong><strong>${entries.reduce((n,e)=>n+e.count,0)} 页</strong></div><p>${[...new Set(entries.map(e=>e.chapter))].join('、')}</p><p>${state.mode} · ${entries.length} 条完成记录</p>${[...new Set(entries.map(e=>e.source))].map(s=>`<span class="source">${s}</span>`).join(' ')}</div>`}).join('')}</section>`}).join(''):'<p class="empty">当前范围内暂无完成记录。</p>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){state.mode=b.dataset.mode;render()}if(b.dataset.filter){state.filter=b.dataset.filter;render()}if(b.dataset.expand){const id=b.dataset.expand;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render()}if(b.dataset.continue)continueWork(b.dataset.continue);if(b.dataset.chapter)openChapter(b.dataset.chapter);if(b.dataset.close)document.getElementById(b.dataset.close).close();if(b.dataset.range){state.range=b.dataset.range;renderTimeline()}if(b.id==='clear'){state.query='';state.filter='全部';$('#search').value='';render()}});
$('#search').oninput=e=>{state.query=e.target.value;render()};$('#sort').onchange=e=>{state.sort=e.target.value;render()};$('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';$('#timelineOpen').onclick=()=>{renderTimeline();$('#timeline').showModal()};$('#mark').onclick=()=>{const {w,c}=active();if(c.done[state.mode]>=c.total)return;history.push({id:c.id,mode:state.mode,done:c.done[state.mode],last:c.last[state.mode],events:events.length});c.done[state.mode]++;c.last[state.mode]=today;events.push({work:w.id,title:w.title,chapter:c.title,mode:state.mode,count:1,at:today,source:'标记时间'});render();renderChapter('已模拟完成一页，作品进度与时间线已同步。')};$('#undo').onclick=()=>{const last=history.pop();if(!last)return;const c=works.flatMap(w=>w.chapters).find(c=>c.id===last.id);c.done[last.mode]=last.done;c.last[last.mode]=last.last;events.length=last.events;render();renderChapter('已撤销上一条模拟操作。')};$('#reset').onclick=()=>{init();state.filter='全部';state.query='';state.sort='recent';$('#search').value='';$('#sort').value='recent';render()};for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});init();render();
</script></body></html>
